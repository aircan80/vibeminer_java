plugins { id 'base' }

version = providers.gradleProperty('appVersion').getOrElse('0.1.0-dev')
ext.javafxVersion = '25.0.2'
def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def x64 = arch in ['amd64', 'x86_64']
def arm64 = arch in ['aarch64', 'arm64']
ext.hostTarget = os.contains('win') && x64 ? 'windows-x64' : os.contains('mac') && arm64 ? 'macos-arm64' : os.contains('mac') && x64 ? 'macos-x64' : os.contains('linux') && x64 ? 'linux-x64' : 'unsupported'
ext.javafxClassifier = os.contains('win') ? 'win' : os.contains('mac') ? (hostTarget == 'macos-arm64' ? 'mac-aarch64' : 'mac') : 'linux'
def selectedTarget = providers.gradleProperty('distributionTarget').getOrElse(hostTarget)
def packageVersion = providers.gradleProperty('packageVersion').getOrElse('0.1.0')
// CFBundleVersion rejects a zero major; keep public semantic versions unchanged.
def nativePackageVersion = providers.provider {
    if (!packageVersion.matches('[0-9]+\\.[0-9]+\\.[0-9]+')) throw new GradleException('packageVersion must be numeric major.minor.patch')
    def components = packageVersion.split('\\.')
    os.contains('mac') ? "${new BigInteger(components[0]) + BigInteger.ONE}.${components[1]}.${components[2]}" : packageVersion
}

subprojects {
    apply plugin: 'java-library'
    group = 'io.vibeminer'
    version = rootProject.version
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }

def bootstrapLibs = project(':bootstrap').layout.buildDirectory.dir('install/bootstrap/lib')
def packageJdk = project(':bootstrap').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
def imageRoot = layout.buildDirectory.dir("package-image/${selectedTarget}")
def outputRoot = layout.buildDirectory.dir("distributions/${selectedTarget}")
def imageDir = providers.provider { new File(imageRoot.get().asFile, os.contains('mac') ? 'VibeMiner.app' : 'VibeMiner') }
def nativeIcon = layout.projectDirectory.file("branding/icons/vibeminer.${os.contains('win') ? 'ico' : os.contains('mac') ? 'icns' : 'png'}")
def iconVerifier = layout.projectDirectory.file('tools/verify_native_icon.py')
// Development-time packaging verification only; shipped launchers do not require Python.
def verifyNativeIcon = { File image = null ->
    providers.exec {
        commandLine os.contains('win') ? 'python' : 'python3', iconVerifier.asFile,
            '--target', selectedTarget, '--source', nativeIcon.asFile
        if (image != null) args '--image', image
    }.result.get().assertNormalExitValue()
}

def legalPackager = layout.projectDirectory.file('tools/package_legal.py')
def sourceRevision = providers.provider {
    def revision = providers.gradleProperty('sourceRevision').orElse(providers.environmentVariable('GITHUB_SHA')).orNull
    def checkoutRevision = null
    try {
        def git = providers.exec { ignoreExitValue = true; commandLine 'git', 'rev-parse', 'HEAD' }
        if (git.result.get().exitValue == 0) checkoutRevision = git.standardOutput.asText.get().trim()
    } catch (Exception ignored) { }
    if (revision == null) revision = checkoutRevision
    if (checkoutRevision != null && revision != checkoutRevision) {
        throw new GradleException('Declared sourceRevision/GITHUB_SHA does not match the checked-out source HEAD.')
    }
    if (revision == null || !revision.matches('[0-9a-f]{40}')) {
        throw new GradleException('Native packaging requires an exact source revision. Build source archives with -PsourceRevision=<40-character original Git SHA>.')
    }
    revision
}
def sourceDirty = providers.provider {
    try {
        def git = providers.exec { ignoreExitValue = true; commandLine 'git', 'status', '--porcelain', '--untracked-files=normal' }
        git.result.get().exitValue == 0 && !git.standardOutput.asText.get().trim().isEmpty()
    } catch (Exception ignored) { false }
}
def packageLegal = { String mode, File image ->
    providers.exec {
        commandLine os.contains('win') ? 'python' : 'python3', legalPackager.asFile, mode,
            '--source', layout.projectDirectory.asFile, '--image', image, '--target', selectedTarget,
            '--commit', sourceRevision.get(), '--version', version.toString()
        if (sourceDirty.get()) args '--dirty'
    }.result.get().assertNormalExitValue()
}

tasks.register('packageImage') {
    dependsOn ':bootstrap:installDist'
    inputs.property('appVersion', version.toString())
    inputs.property('packageVersion', packageVersion)
    inputs.dir(bootstrapLibs)
    inputs.file(nativeIcon)
    inputs.file(iconVerifier)
    inputs.files('LICENSE', 'NOTICE', 'docs/LICENSING.md')
    inputs.file(legalPackager)
    inputs.property('sourceRevision', sourceRevision)
    inputs.property('sourceDirty', sourceDirty)
    inputs.property('distributionTarget', selectedTarget)
    outputs.dir(imageRoot)
    doLast {
        if (hostTarget == 'unsupported') throw new GradleException("Unsupported native packaging host: ${os}/${arch}")
        if (selectedTarget != hostTarget) throw new GradleException("Native packaging requires matching host: ${hostTarget}, requested ${selectedTarget}")
        if (!packageVersion.matches('[0-9]+\\.[0-9]+\\.[0-9]+')) throw new GradleException('packageVersion must be numeric major.minor.patch')
        verifyNativeIcon()
        delete imageRoot
        def javaHome = packageJdk.get().metadata.installationPath.asFile
        def jpackage = new File(javaHome, "bin/jpackage${os.contains('win') ? '.exe' : ''}")
        def packaging = providers.exec {
            ignoreExitValue = true
            commandLine jpackage.absolutePath, '--type', 'app-image', '--name', 'VibeMiner',
                '--input', bootstrapLibs.get().asFile, '--icon', nativeIcon.asFile,
                '--main-jar', "bootstrap-${version}.jar", '--main-class', 'io.vibeminer.bootstrap.Main',
                '--app-version', nativePackageVersion.get(), '--vendor', 'VibeMiner', '--dest', imageRoot.get().asFile,
                '--java-options', '--enable-native-access=ALL-UNNAMED',
                '--add-modules', 'java.base,java.desktop,java.logging,java.net.http,java.sql,java.xml,jdk.unsupported,jdk.crypto.ec'
            // Intel virtual GPUs can abort in Metal after OpenGL initialization fails.
            // Preserve OpenGL acceleration where available, with software as the safe fallback.
            if (hostTarget == 'macos-x64') args '--java-options', '-Dprism.order=es2,sw'
        }
        def result = packaging.result.get()
        logger.lifecycle(packaging.standardOutput.asText.get().trim())
        def diagnostics = packaging.standardError.asText.get().trim()
        if (diagnostics) logger.lifecycle(diagnostics)
        if (result.exitValue != 0) throw new GradleException("jpackage failed (${result.exitValue}): ${diagnostics}")
        verifyNativeIcon(imageDir.get())
        packageLegal('copy', imageDir.get())
        packageLegal('verify', imageDir.get())
    }
}

tasks.register('packageDistribution') {
    dependsOn 'packageImage'
    inputs.property('appVersion', version.toString())
    inputs.dir(imageRoot)
    outputs.dir(outputRoot)
    doLast {
        delete outputRoot
        outputRoot.get().asFile.mkdirs()
        def archive = new File(outputRoot.get().asFile, "VibeMiner-${version}-${selectedTarget}.${os.contains('linux') ? 'tar.gz' : 'zip'}")
        if (os.contains('linux')) {
            providers.exec { commandLine 'tar', '-czf', archive, '-C', imageRoot.get().asFile, imageDir.get().name }.result.get().assertNormalExitValue()
        } else if (os.contains('mac')) {
            providers.exec { commandLine 'ditto', '-c', '-k', '--keepParent', imageDir.get(), archive }.result.get().assertNormalExitValue()
        } else {
            ant.zip(destfile: archive, basedir: imageRoot.get().asFile)
        }
        logger.lifecycle("Portable bundled distribution: ${archive}")
    }
}

tasks.register('verifyDistribution') {
    dependsOn 'packageDistribution'
    doLast {
        def verifyRoot = layout.buildDirectory.dir("verification/${selectedTarget}").get().asFile
        delete verifyRoot
        verifyRoot.mkdirs()
        def archive = outputRoot.get().asFile.listFiles().find { it.name.endsWith(os.contains('linux') ? '.tar.gz' : '.zip') }
        if (os.contains('linux')) {
            providers.exec { commandLine 'tar', '-xzf', archive, '-C', verifyRoot }.result.get().assertNormalExitValue()
        } else if (os.contains('mac')) {
            providers.exec { commandLine 'ditto', '-x', '-k', archive, verifyRoot }.result.get().assertNormalExitValue()
        } else {
            ant.unzip(src: archive, dest: verifyRoot)
        }
        def root = new File(verifyRoot, imageDir.get().name)
        verifyNativeIcon(root)
        packageLegal('verify', root)
        def launcher = new File(root, os.contains('mac') ? 'Contents/MacOS/VibeMiner' : os.contains('win') ? 'VibeMiner.exe' : 'bin/VibeMiner')
        def selfTest = providers.exec { ignoreExitValue = true; commandLine launcher.absolutePath, '--self-test' }
        def selfResult = selfTest.result.get()
        def selfErrors = selfTest.standardError.asText.get().trim()
        if (selfErrors) logger.lifecycle(selfErrors)
        if (selfResult.exitValue != 0) throw new GradleException("Bundled self-test failed (${selfResult.exitValue}): ${selfErrors}")
        def selfOutput = selfTest.standardOutput.asText.get()
        if (!selfOutput.contains('VibeMiner self-test OK')) throw new GradleException("Bundled launch failed: ${selfOutput}")
        logger.lifecycle(selfOutput.trim())
        def uiTest = providers.exec { ignoreExitValue = true; commandLine launcher.absolutePath, '--smoke-test' }
        def uiResult = uiTest.result.get()
        def uiErrors = uiTest.standardError.asText.get().trim()
        if (uiErrors) logger.lifecycle(uiErrors)
        if (uiResult.exitValue != 0) throw new GradleException("Bundled UI smoke failed (${uiResult.exitValue}): ${uiErrors}\n${uiTest.standardOutput.asText.get()}")
        def uiOutput = uiTest.standardOutput.asText.get()
        if (!uiOutput.contains('VibeMiner UI smoke OK')) throw new GradleException("Bundled JavaFX launch failed: ${uiOutput}")
        logger.lifecycle(uiOutput.trim())
    }
}
