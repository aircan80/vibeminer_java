let archive=[{id:'65042',status:'Archived',pinned:true},{id:'65018',status:'Archived',pinned:true},{id:'64980',status:'Available remotely',pinned:false},{id:'64892',status:'Unavailable remotely',pinned:false}],activeBuild='65042';let settingsState=[],investigations=[],watchlists=[],investigationName='The sentinel thread';const $=s=>document.querySelector(s);let page='overview',asset='Model',record='Moonlit sentinel',tab='All changes',selected='SpellName',query='',jobs=[{name:'Index DB2 relations',pct:68,status:'Running'},{name:'Cache asset previews',pct:100,status:'Completed'}];const pages=['overview','builds','compare','explore','assets','notebook','jobs'];const names={overview:'Workspace',builds:'Archive',compare:'Compare',explore:'Database',assets:'Assets',notebook:'Notebook',jobs:'Activity',settings:'Settings',search:'Search'};let notes=localStorage.getItem('atlasNotes')||'Investigate the sentinel appearance and associated spell changes. Cross-reference the reward item before publishing.';
function esc(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;')}function toast(t){$('#toast').innerHTML='<div class="toast" role="status">'+t+'</div>';setTimeout(()=>$('#toast').innerHTML='',2800)}function go(p){page=p;render()}function title(ey,h,sub,action=''){return `<div class="eyebrow">${ey}</div><div class="title"><div><h1>${h}</h1><div class="muted">${sub}</div></div><div class="toolbar">${action}</div></div>`}function btn(t,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${t}</button>`}function exportData(fmt){const data=[{scope:page,build:'12.0.0.65042',baseline:'12.0.0.65018',locale:'enUS',region:'US',schema:'demo-schema-2026.10',id:42108,name:record,field:'Duration',before:12,after:15,source:'Demo CDN snapshot',investigation:investigationName}];const raw=fmt==='JSON'?JSON.stringify(data,null,2):Object.keys(data[0]).join(',')+'\n'+Object.values(data[0]).map(v=>'\"'+String(v).replaceAll('\"','\"\"')+'\"').join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'text/plain'}));a.download='vibeminer-demo.'+fmt.toLowerCase();a.click();toast(fmt+' export downloaded with build provenance')}
function evidence(){return `<div class="panel"><div class="eyebrow">Investigator’s notebook</div><h3 style="margin-top:12px">The sentinel thread</h3><p class="muted small">A place for questions, context and things worth following.</p><div class="note"><b>Working hypothesis</b><p class="small">A new appearance is linked to a changed reward record. Availability is unconfirmed.</p></div><label class="small" for="note">Your private notes</label><textarea id="note" oninput="notes=this.value;localStorage.setItem('atlasNotes',notes)">${notes.replaceAll('<','&lt;')}</textarea><div class="spacer"></div>${btn('Open investigation',"go('notebook')")}<div class="row small"><span>Evidence attached</span><b>4 records</b></div><div class="row small"><span>Source</span><span class="tag">CDN snapshot</span></div><p class="muted small">A datamined record is evidence of client content, not a promise of release.</p></div>`}
function overview(){return title('RESEARCH WORKSPACE / 17 OCT 2026','Follow the changes. Find the story.','Your latest build is indexed. There are 3 threads worth a closer look.',btn('Compare latest builds',"go('compare')",'primary'))+`<div class="grid"><div class="panel"><span class="tag">LATEST DEMO BUILD</span><span class="stat">12.0.0.65042</span><p class="muted">Retail · enUS · indexed 18 minutes ago</p>${btn('Open build library →',"go('builds')")}</div><div class="panel"><span class="eyebrow">CHANGES SINCE 65018</span><span class="stat">1,284 <small style="font:14px Arial">records</small></span><span class="tag">+ 218 added</span><span class="tag gold">~ 1,041 changed</span><span class="tag gray">− 25 removed</span></div><div class="panel"><span class="eyebrow">YOUR RESEARCH</span><span class="stat">03 <small style="font:14px Arial">investigations</small></span><p class="muted">2 watchlists have new matches</p>${btn('Continue in notebook →',"go('notebook')")}</div></div><div class="spacer"></div><div class="split"><div class="panel"><div class="eyebrow">FIELD NOTES / BUILD 65042</div><h2 style="margin-top:10px">What deserves a closer look</h2>${[['01','Moonlit sentinel','New model, appearance and reward references','assets'],['02','Spell tuning, in context','142 values changed across 38 spells','compare'],['03','A coastline, unnamed','12 new terrain tiles and 3 area labels','assets']].map(x=>`<div class="row"><span style="font:26px Georgia;color:var(--gold)">${x[0]}</span><div style="flex:1"><h3>${x[1]}</h3><span class="muted small">${x[2]}</span></div>${btn('Investigate ↗',`go('${x[3]}')`)}</div>`).join('')}<div class="note"><span class="eyebrow">SOURCE DISCIPLINE</span><p>Every finding refers to an exact CDN snapshot. Keep older builds in an app-owned archive for reproducible research.</p>${btn('Open build archive',"go('builds')")}</div></div>${evidence()}</div>`}
function builds(){return title('APP-OWNED BUILD ARCHIVE','Keep the history. Reopen the evidence.','Blizzard CDN only · isolated VibeMiner storage · selected content downloaded on demand.',btn('Find older build',"addBuild()",'primary'))+`<div class="split"><div class="panel"><div class="toolbar"><input aria-label="Filter archived builds" placeholder="Filter builds…" oninput="filterRows(this.value)"><select aria-label="Archive filter" onchange="document.querySelectorAll('tbody tr').forEach(r=>r.hidden=this.value!=='All builds'&&!r.textContent.includes(this.value))"><option>All builds</option><option>Archived</option><option>Available remotely</option><option>Unavailable remotely</option></select></div><table><thead><tr><th>Build / source</th><th>Archive status</th><th>Actions</th></tr></thead><tbody>${archive.map((b,i)=>`<tr><td><b>12.0.0.${b.id}</b><br><span class="muted small">Retail / US / enUS · fictional CDN</span></td><td><span class="tag ${b.status==='Archived'?'':'gold'}">${b.status}</span><br><span class="small muted">${b.pinned?'Pinned · retained':b.status==='Archived'?'Eligible for cleanup':'Not stored locally'}</span></td><td>${btn('Inspect',`buildDetail('${b.id}')`)} ${b.status==='Archived'?btn('Reopen offline',`activeBuild='${b.id}';go('explore');toast('Opened app-owned archive 12.0.0.${b.id}')`)+btn(b.pinned?'Unpin':'Pin',`archive[${i}].pinned=!archive[${i}].pinned;render()`):b.status==='Available remotely'?btn('Download',`queueArchive('${b.id}')`):btn('Check availability',`toast('Demo CDN content is unavailable; metadata retained')`)}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h2>One shared content store</h2><p class="muted">Build manifests reference a shared content-addressed object store. Identical content across versions is stored once, including cached content. Archived builds reopen offline.</p><div class="note"><b>Selected content, verified locally</b><p class="small">Keep metadata and databases first. Fetch asset payloads when requested. Pinned builds are protected from cleanup.</p></div><div class="row"><span>Archived builds</span><b>${archive.filter(b=>b.status==='Archived').length}</b></div><div class="row"><span>Logical build total</span><b>14.6 GB</b></div><div class="row"><span>Unique physical storage</span><b>8.2 GB / 50 GB</b></div><div class="row"><span>Shared across builds</span><b>6.4 GB saved</b></div>${btn('Review cleanup',"cleanupArchive()")}</div></div>`}
function queueArchive(id){const b=archive.find(x=>x.id===id);b.status='Downloading';jobs.unshift({name:'Archive build '+id,pct:12,status:'Running',build:id});go('jobs');toast('Only 240 MB unique objects queued; 6.4 GB reused from shared store')}
function cleanupArchive(){const eligible=archive.filter(x=>x.status==='Archived'&&!x.pinned);modal('Review archive cleanup.',`<p>Pinned builds remain retained. Only unpinned app-owned content is eligible.</p><p><b>${eligible.length} build(s)</b> selected for removal: ${eligible.map(x=>'12.0.0.'+x.id).join(', ')||'none; unpin a build first'}.</p><p class="muted">Only unreferenced objects are freed. Other builds retain their shared objects. Estimated reclaimable: ${eligible.length?'1.8 GB':'0 bytes'}. Shared content retained: 6.4 GB. Evidence notes and source metadata are retained.</p>`,btn('Confirm cleanup',"archive.forEach(b=>{if(b.status==='Archived'&&!b.pinned)b.status='Available remotely'});closeModal();go('builds');toast('Only unreferenced objects removed; shared objects retained')",'primary'))}

tionships</p><div class="toolbar">${btn('Export CSV',"exportData('CSV')")}${btn('Pin this comparison',"toast('Comparison pinned to The sentinel thread')")}</div></div>${evidence()}</div>`}
const db={SpellName:[{id:42108,name:'Moonlit sentinel',status:'Added',fields:{School:'Arcane',Description:'Calls the fictional sentinel'},relation:'SpellEffect'},{id:42109,name:'Lunar protection',status:'Changed',fields:{School:'Arcane',Description:'Protects the target'},relation:'SpellEffect'}],SpellEffect:[{id:42108,name:'Sentinel duration',status:'Changed',fields:{Duration:'15 seconds',Coefficient:'0.94',Effect:'Apply aura'},relation:'SpellName'},{id:42109,name:'Lunar shield',status:'Changed',fields:{Duration:'8 seconds',Coefficient:'0.80',Effect:'Absorb'},relation:'SpellName'}],ItemSparse:[{id:90211,name:'Sentinel reins',status:'Added',fields:{Quality:'Epic',Class:'Miscellaneous',Acquisition:'Unknown'},relation:'Mount'},{id:90212,name:'Surveyor ornament',status:'Changed',fields:{Quality:'Rare',Class:'Armor',Acquisition:'Unknown'},relation:'CreatureDisplayInfo'}],Mount:[{id:1811,name:'Moonlit sentinel',status:'Added',fields:{CreatureDisplayID:'8842',SourceSpellID:'42108',Availability:'Unconfirmed'},relation:'CreatureDisplayInfo'},{id:1812,name:'Coastal glider',status:'Added',fields:{CreatureDisplayID:'8843',SourceSpellID:'42109',Availability:'Unconfirmed'},relation:'CreatureDisplayInfo'}],CreatureDisplayInfo:[{id:8842,name:'Sentinel appearance',status:'Added',fields:{ModelFileDataID:'580121',Scale:'1.0',MaterialFileDataID:'580122'},relation:'Mount'},{id:8843,name:'Glider appearance',status:'Added',fields:{ModelFileDataID:'580123',Scale:'0.85',MaterialFileDataID:'580124'},relation:'Mount'}],AreaTable:[{id:12084,name:'Moonlit coast',status:'Changed',fields:{ParentAreaID:'12000',MapID:'2901',PreviousName:'Coastline'},relation:'AreaTable'},{id:12085,name:'Silver inlet',status:'Added',fields:{ParentAreaID:'12084',MapID:'2901',PreviousName:'—'},relation:'AreaTable'}]};
function explorer(){const rows=db[selected]||db.SpellName;const current=rows.find(r=>r.name===record)||rows[0];record=current.name;return title('DATABASE EXPLORER','Read between the records.','Browse decoded DB2 tables and follow their relationships.',btn('Export record',"exportData('JSON')"))+`<div class="triple"><div class="panel"><h3>Tables</h3><input type="search" aria-label="Filter tables" placeholder="Find a table…" oninput="document.querySelectorAll('.tablebtn').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))"><div class="spacer"></div>${Object.keys(db).map(t=>`<button class="listbutton tablebtn ${selected===t?'active':''}" onclick="selected='${t}';record='';render()">${t}<span class="muted small" style="display:block">${db[t].length} sample records</span></button>`).join('')}</div><div class="panel"><div class="toolbar"><h2 style="flex:1">${selected}</h2><span class="tag">DBD decoded</span></div><input type="search" aria-label="Filter records" placeholder="Search records or enter an ID…" oninput="filterRows(this.value)"><table><thead><tr><th>ID</th><th>Name · enUS</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr class="${current.id===r.id?'chosen':''}" onclick="record='${r.name}';render()"><td>${r.id}</td><td>${r.name}</td><td><span class="tag ${r.status==='Changed'?'gold':''}">${r.status}</span></td></tr>`).join('')}</tbody></table><div class="row small"><span class="muted">${rows.length} representative records · fictional data</span></div><h3 style="margin-top:22px">Decoded fields</h3><p class="muted small">${Object.keys(current.fields).join(' · ')}</p></div><div class="panel"><span class="eyebrow">${selected} / RECORD ${current.id}</span><h2 style="margin-top:10px">${current.name}</h2><span class="tag">CDN snapshot</span><span class="tag ${current.status==='Changed'?'gold':''}">${current.status}</span>${Object.entries(current.fields).map(([k,v])=>`<div class="row small"><span>${k}</span><b>${v}</b></div>`).joi function assets(){return title('ASSET ATLAS','Content, in context.','Preview files and follow the records that reference them.',btn('Export manifest',"exportData('JSON')"))+`<div class="tabs">${['Model','Texture','Audio','Map','Text'].map(t=>btn(t,`asset='${t}';render()`,asset===t?'active':'')).join('')}<input type="search" style="margin-left:auto;max-width:260px" placeholder="Filter assets…" aria-label="Filter assets" oninput="document.querySelectorAll('.asset-card').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))"></div><div class="split"><div><div class="panel"><div class="toolbar"><h2 style="flex:1">${asset==='Model'?'Moonlit sentinel':asset==='Texture'?'Sentinel ornament':asset==='Audio'?'Coastal ambience':asset==='Map'?'Moonlit coast':'Sentinel dialogue'}</h2><span class="tag">NEW IN 65042</span></div><div class="preview ${asset==='Map'?'hero-map':''}" id="assetpreview">${visual(asset)}</div><div class="row"><span class="small muted">Original illustrative preview · fictional asset</span><div class="toolbar">${asset==='Audio'?btn('▶ Play synthetic preview',"playAudio()")+btn('Stop',"stopAudio()"):asset==='Model'?btn('Rotate 45°',"rotateModel()")+btn('Wireframe',"document.querySelector('#assetpreview svg').style.opacity=document.querySelector('#assetpreview svg').style.opacity==='0.45'?'1':'0.45'"):btn('Zoom',"document.querySelector('#assetpreview').style.minHeight='420px'")}</div></div></div><div class="spacer"></div><div class="grid">${[1,2,3].map((n)=>`<button class="panel asset-card ${n===1?'active':''}" onclick="toast('Preview selected: ${asset} variant ${n}')"><div class="preview">${visual(asset)}</div><b>${asset} ${n===1?'primary':n===2?'variant':'reference'}</b><div class="muted small">FileDataID ${580120+n}</div></button>`).join('')}</div></div><div class="panel"><span class="eyebrow">FILE EVIDENCE</span><h3 style="margin-top:12px">FileDataID 580121</h3><p class="small" style="overflow-wrap:anywhere">demo/${asset.toLowerCase()}/sentinel_${asset==='Model'?'01.m2':asset==='Texture'?'ornament.blp':asset==='Audio'?'coast.ogg':asset==='Map'?'coast.adt':'dialogue.txt'}</p><div class="row small"><span>Source</span><span class="tag">CDN snapshot</span></div><div class="row small"><span>First seen</span><b>65042</b></div><div class="row small"><span>Size</span><b>2.4 MB</b></div><div class="row small"><span>CKey</span><code>demo-8c4a…12de</code></div><div class="row small"><span>EKey</span><code>demo-63bf…a910</code></div><p class="small muted">FileDataID remains usable when a filename is unresolved.</p><div class="row small"><span>Availability</span><b>Cached</b></div><h3 style="margin-top:20px">Referenced by</h3>${btn('CreatureDisplayInfo · 8842',"selected='CreatureDisplayInfo';go('explore')")}<div class="note small">Appearance in a client build does not confirm gameplay availability.</div><div class="toolbar">${btn('Pin evidence',"toast('Asset pinned to notebook')")}${btn('Export metadata',"exportData('JSON')")}</div><div class="spacer"></div><label class="check"><input type="checkbox" onchange="toast('Preview background preference saved')"> Checkerboard background</label></div></div>`}
function notebook(){return title('INVESTIGATOR’S NOTEBOOK','Questions become investigations.','Keep your evidence, notes and watchlists together.',btn('New investigation',"saveInvestigation()",'primary'))+`<div class="split"><div class="panel"><div class="eyebrow">ACTIVE INVESTIGATION / 01</div><h2 style="margin-top:12px">${esc(investigationName)}</h2><span class="tag">4 pieces of evidence</span><span class="tag gold">Unconfirmed availability</span><div class="spacer"></div><textarea aria-label="Investigation notes" oninput="notes=this.value;localStorage.setItem('atlasNotes',notes)">${notes.replaceAll('<','&lt;')}</textarea><h3 style="margin-top:23px">Evidence trail</h3>${[['CDN snapshot','SpellEffect 42108','Duration changed from 12 s to 15 s','compare'],['CDN snapshot','FileDataID 580121','New sentinel model and material references','assets'],['CDN snapshot','ItemSparse 90211','Reward reference added; acquisition unknown','explore'],['Archived CDN','Build 65018','Pinned baseline retained in app-owned storage','builds']].map((r,i)=>`<div class="row"><span class="tag ${i===3?'gold':''}">${r[0]}</span><div style="flex:1"><b>${r[1]}</b><div class="small muted">${r[2]}</div></div>${btn('Open ↗',`go('${r[3]}')`)}</div>`).join('')}<div class="spacer"></div>${btn('Export investigation',"exportData('JSON')")}</div><div><div class="panel"><h2>Watchlists</h2>${watchlists.map((w,i)=>`<div class="row"><div><b>${esc(w.name)}</b><p class="small muted">${esc(w.table)} · ${esc(w.query)}</p><span class="tag">${w.enabled?'Enabled':'Paused'}</span></div><input aria-label="Enable ${esc(w.name)}" type="checkbox" ${w.enabled?'checked':''} onchange="watchlists[${i}].enabled=this.checked;render()"></div>`).join('')}<div class="row"><div><b>Mounts & appearances</b><p class="small muted">Mount, ItemSparse, model files</p><span class="tag">12 new matches</span></div><input type="checkbox" checked aria-label="Enable mounts watchlist" onchange="toast(this.checked?'Watchlist enabled':'Watchlist function activity(){return title('ACTIVITY','Work happening in the background.','Downloads, decoding and indexing stay visible and cancellable.',btn('Queue demo job',"jobs.unshift({name:'Download selected build',pct:12,status:'Running'});render()",'primary'))+`<div class="panel">${jobs.map((j,i)=>`<div style="padding:15px 0"><div class="toolbar"><h3 style="flex:1">${j.name}</h3><span class="tag ${j.status==='Failed'?'gold':''}">${j.status}</span><span>${j.pct}%</span>${j.status==='Running'?btn('Complete demo',`jobs[${i}].status='Completed';jobs[${i}].pct=100;if(jobs[${i}].build)archive.find(b=>b.id===jobs[${i}].build).status='Archived';render()`)+btn('Cancel',`jobs[${i}].status='Cancelled';render()`):j.status!=='Completed'?btn('Retry',`jobs[${i}].status='Running';jobs[${i}].pct=5;render()`):btn('View result',"go('explore')")}</div><div class="metricline"><i style="width:${j.pct}%"></i></div><div class="small muted">${j.status==='Running'?'Local demo task · no network requests':j.status==='Cancelled'?'Cancelled safely · cached data retained':'Source: fictional CDN snapshot → VibeMiner archive'}</div></div>`).join('')}<div class="row"><span class="muted small">Network concurrency 4 · cache usage 8.2 GB</span>${btn('Simulate failure',"jobs[0].status='Failed';render()")}</div></div>`}
function saveSettings(){settingsState=Array.from(document.querySelectorAll('#app input,#app select')).map(el=>({value:el.value,checked:el.checked}));localStorage.setItem('atlasSettings',JSON.stringify(settingsState));toast('Workspace preferences saved locally')}function settings(){return title('WORKSPACE PREFERENCES','Make room for your research.','Local settings for this interactive demonstration.',btn('Save settings',"saveSettings()",'primary'))+`<div class="grid"><div class="panel"><h2>Storage & cache</h2><label>App-owned archive directory<input style="width:100%;margin:10px 0" value="~/VibeMiner/archive" aria-label="App-owned archive directory"></label><label>Cache budget<select style="width:100%;margin:10px 0"><option>50 GB</option><option>100 GB</option><option>Unlimited</option></select></label><p class="small muted">8.2 GB used · metadata retained when clearing previews.</p>${btn('Clear asset previews',"toast('Demo preview cache cleared; indexed records retained')")}</div><div class="panel"><h2>Data & definitions</h2><label>Primary locale<select style="width:100%;margin:10px 0"><option>enUS</option><option>deDE</option><option>frFR</option><option>esES</option></select></label><label>Definitions<select style="width:100%;margin:10px 0"><option>Bundled demo-schema-2026.10</option><option>Custom definition folder</option></select></label>${btn('Check definitions',"toast('Bundled demo definitions are current')")}<label class="check"><input type="checkbox" checked> Preserve raw fields for unknown schemas</label></div><div class="panel"><h2>Research boundaries</h2><label class="check"><input type="checkbox" checked> Hide story spoilers by default</label><label class="check"><input type="checkbox" checked> Mark unconfirmed content</label><label class="check"><input type="checkbox" checked> Include provenance in exports</label><label class="check"><input type="checkbox" checked> Protect pinned builds from cleanup</label><p class="small muted">Locked or encrypted content stays visibly unavailable. This demo does not download client data.</p></div></div>`}
function search(){return title('GLOBAL SEARCH','Every trail starts somewhere.',`Results for “${query||'sentinel'}” across your indexed builds.`)+`<div class="panel"><input type="search" aria-label="Search query" value="${query}" placeholder="Search names, paths, IDs…" oninput="query=this.value;document.querySelectorAll('.result').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(query.toLowerCase()))"><div class="tabs" style="margin-top:18px">${['All results','Records','Files','Investigations'].map(t=>btn(t,"toast('Result category selected')")).join('')}</div>${[['Database record','Moonlit sentinel','SpellName · ID 42108 · build 65042','explore'],['Model file','Sentinel model','FileDataID 580121 · CDN snapshot','assets'],['Investigation','The sentinel thread','4 evidence links · private notebook','notebook'],['Database record','Sentinel reins','ItemSparse · ID 90211 · build 65042','explore']].map(r=>`<div class="row result"><div><span class="eyebrow">${r[0]}</span><h3 style="margin:7px 0">${r[1]}</h3><span class="small muted">${r[2]}</span></div>${btn('Open →',`go('${r[3]}')`)}</div>`).join('')}</div>`}
function render(){const state=$('#state').value;$('#nav').innerHTML=pages.map(p=>`<button class="${page===p?'selected':''}" onclick="go('${p}')">${names[p]}</button>`).join('');let html='';if(state==='remote unavailable')html+='<div class="banner"><span><b>Remote content unavailable.</b> This older build cannot currently be downloaded. Existing archived content and source metadata remain accessible.</span>'+btn('Open archive',"go('builds')")+'</div>';if(state==='offline')html+='<div class="banner"><span><b>Offline workspace.</b> Cached builds and investigations remain available.</span>'+btn('Retry connection',"$('#state').value='ready';render();toast('Demo connection restored')")+'</div>';if(state==='encrypted')html+='<div class="banner"><span><b>Encrypted content.</b> 18 files have no available key; metadata is visible, previews are unavailable.</span>'+btn('View metadata',"go('assets')")+'</div>';if(state==='schema unknown')html+='<div class="banner"><span><b>Unknown DB2 schema.</b> Raw field values are retained; decoded names and relations are incomplete.</span>'+btn('Manage definitions',"go('settings')")+'</div>';if(state==='loading')html+=title('INDEXING YOUR WORKSPACE','Connecting the evidence.','Reading cached demo metadata. You can cancel this operation.')+'<div class="panel empty"><span>◈</span><h2>Indexing build 65042</h2><div class="metricline"><i style="width:62%"></i></div><p class="muted">62% · Resolving database relationships</p>'+btn('Cancel indexing',"$('#state').value='ready';render();toast('Indexing cancelled; cached records retained')")+'</div>';else if(state==='error')html+='<div class="panel empty"><span>!</span><h1>The build could not be indexed.</h1><p class="muted">Demo integrity check failed for one content block. Your cached data is safe.</p>'+btn('Retry',"$('#state').value='ready';render()",'primary')+' '+btn('View activity',"$('#state').value='ready';go('jobs')")+'</div>';else if(state==='empty')html+='<div class="panel empty"><span>◇</span><h1>A fresh page for your research.</h1><p class="muted">No builds match this workspace yet. Add a source or load the sample dataset.</p>'+btn('Add first build',"addBuild()",'primary')+' '+btn('Load demo data',"$('#state').value='ready';render()")+'</div>';else html+=({overview,builds,compare:comparison,explore:explorer,assets,notebook,jobs:activity,settings,search}[page]||overview)();$('#app').innerHTML=html;if(page==='settings'){const saved=JSON.parse(localStorage.getItem('atlasSettings')||'[]');document.querySelectorAll('#app input,#app select').forEach((el,i)=>{if(saved[i]){el.value=saved[i].value;if(el.type==='checkbox')el.checked=saved[i].checked}})}if(state==='encrypted'&&page==='assets'){document.querySelectorAll('.preview').forEach(p=>p.innerHTML='<div class=\"empty\"><h3>Encrypted file</h3><p class=\"muted small\">No key available · metadata retained</p></div>')}}
function filterRows(v){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(v.toLowerCase()))}function modal(h,body,action){$('#overlay').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${h}"><div class="eyebrow">VibeMiner / ATLAS</div><h1 style="margin:12px 0 20px">${h}</h1>${body}<div class="toolbar" style="justify-content:flex-end;margin-top:20px">${btn('Cancel',"closeModal()")}${action}</div></section></div>`;setTimeout(()=>$('#overlay input, #overlay button')?.focus(),30)}function closeModal(){$('#overlay').innerHTML=''}function setup(){modal('Your research begins here.',`<p class="muted">Set up a standalone workspace. The production app uses the Blizzard CDN without a game installation or Battle.net. This prototype uses fictional data and never connects to Blizzard.</p><label>Workspace name<input value="My Warcraft research"></label><label>Primary locale<select><option>English · enUS</option><option>German · deDE</option><option>French · frFR</option></select></label><label>Data source<select><option>Blizzard CDN · fictional sample builds</option></select></label><label class="check"><input type="checkbox" checked> Hide story spoilers</label>`,btn('Create workspace',"closeModal();$('#state').value='ready';go('overview');toast('Workspace created with fictional sample builds')",'primary'))}function addBuild(){modal('Add a build.',`<p class="muted">Select a source to simulate adding a build. Downloads are selected on demand and verified in a local cache; no game installation is required.</p><label>Source<select><option>Blizzard CDN · simulated</option></select></label><label>Product<select><option>Retail</option><option>PTR</option><option>Classic</option></select></label><label>Older build<input id="archiveBuildInput" value="12.0.0.64980"></label><p class="small muted">7.3 GB logical · 240 MB unique download · 6.4 GB shared content reused</p><label class="check"><input type="checkbox" checked> Index databases and file metadata</label>`,btn('Add to library',"const id=$('#archiveBuildInput').value.split('.').pop();if(!archive.find(b=>b.id===id))archive.push({id,status:'Available remotely',pinned:false});closeModal();$('#state').value='ready';queueArchive(id)",'primary'))}function buildDetail(n){const b=archive.find(x=>x.id===n);modal('Build 12.0.0.'+n,`<span class="tag">FICTIONAL DEMO</span><div class="row"><span>Exact source</span><b>Blizzard CDN snapshot / Retail / US</b></div><div class="row"><span>Locale / status</span><b>enUS / ${b?.status||'Metadata only'}</b></div><div class="row"><span>Build config</span><code>demo-${n}-a80e4cc2</code></div><div class="row"><span>Manifest</span><b>VibeMiner/manifests/${n}</b></div><div class="row"><span>Logical / unique additional</span><b>7.3 GB / 240 MB</b></div><div class="row"><span>Reused shared content</span><b>6.4 GB · never copied per build</b></div><div class="row"><span>Object store</span><b>VibeMiner/objects/by-hash</b></div><div class="row"><span>Integrity</span><b>${b?.status==='Archived'?'Verified selected content':'Not downloaded'}</b></div><div class="row"><span>Schema</span><b>demo-schema-2026.10</b></div><p class="muted">Selected metadata + DB2 + requested assets. Archived content stays available offline.</p>`,b?.status==='Archived'?btn('Open archived build',`activeBuild='${n}';closeModal();go('explore')`,'primary'):b?.status==='Available remotely'?btn('Download selected content',`closeModal();queueArchive('${n}')`,'primary'):btn('Close',"closeModal()"))}
function saveInvestigation(){modal('Start an investigation.',`<label>Title<input id="investigationTitle" value="The sentinel thread"></label><label>Question<textarea>What changed, and which records connect the new appearance to a reward?</textarea></label><label class="check"><input type="checkbox" checked> Attach selected comparison and source metadata</label>`,btn('Save investigation',"investigationName=$('#investigationTitle').value||'Untitled investigation';investigations.push(investigationName);closeModal();go('notebook');toast('Investigation saved with source evidence')",'primary'))}function watchlist(){modal('Keep an eye on a pattern.',`<label>Watchlist name<input id="watchName" value="New mount appearances"></label><label>Table<select id="watchTable"><option>Mount</option><option>SpellEffect</option><option>ItemSparse</option></select></label><label>Match expression<input id="watchQuery" value="change = added"></label><label class="check"><input type="checkbox" checked> Evaluate when a new build is indexed</label>`,btn('Save watchlist',"watchlists.push({name:$('#watchName').value,table:$('#watchTable').value,query:$('#watchQuery').value,enabled:true});closeModal();render();toast('Watchlist saved · evaluated on future demo builds')",'primary'))}let rotation=0;function rotateModel(){rotation+=45;$('#assetpreview svg').style.transform=`rotateY(${rotation}deg)`}let audioctx;function playAudio(){stopAudio();audioctx=new(window.AudioContext||window.webkitAudioContext)();const o=audioctx.createOscillator(),g=audioctx.createGain();o.type='sine';o.frequency.value=180;g.gain.value=.035;o.connect(g);g.connect(audioctx.destination);o.start();toast('Playing a synthetic tone, not a Warcraft audio file');setTimeout(stopAudio,1800)}function stopAudio(){if(audioctx){audioctx.close();audioctx=null}}$('#state').onchange=render;$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){query=e.target.value;go('search')}};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus()}});render();
