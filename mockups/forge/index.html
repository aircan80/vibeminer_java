style="padding-bottom:0"><h2>'+table+' <span class="pill">SCHEMA RESOLVED</span></h2><small>6 demo rows · build 60042 · localized enUS</small></div>'+toolbar()+rows(records.filter(r=>r[2]===table)))+'</div></div>';case'Asset explorer':return viewHeading('Look beneath the surface.','Explore named files and inspect original placeholder previews.','<button onclick="notify(\'File-name list refreshed from local demo\')">Resolve names</button>')+'<div class="panel" style="margin-bottom:18px">'+toolbar('Filter names, FileDataIDs or types…')+'</div><div class="assetgrid">'+files.map(([name,type,id])=>'<button class="assetcard" data-filter="'+name+' '+type+' '+id+'" onclick="assetDetail(\''+type+'\',\''+name+'\')"><div class="preview">'+(type==='Encrypted'?'<span style="font-size:36px">▧</span>':type==='Audio'?'<span style="font-size:32px;color:var(--accent)">▂ ▆ ▃ ▇ ▄</span>':type==='Text'?'<span style="font:24px monospace;color:var(--accent)">{ … }</span>':svg(type))+'</div><strong>'+name+'</strong><small>'+type+' · '+id+'</small></button>').join('')+'</div>';case'Search':return viewHeading('One archive. Every connection.','Search across decoded records, file names and localized text.')+'<div class="panel">'+toolbar('Try “ember”, “mount”, or a record ID…')+rows()+'</div><div class="notice">Search scope: cached builds · names and text · encrypted content excluded. Filters and search are functional on these sample rows.</div>';case'Notebook':return viewHeading('Build a case.','Keep notes and the evidence behind each investigation.','<button onclick="download(\'json\')">Export evidence</button>')+'<div class="grid"><div class="panel pad"><h2>Ember research</h2><p>Private session notebook · no external publishing</p><textarea aria-label="Investigation notes" id="researchNote" style="width:100%;height:210px;background:#14171a;color:#e5e8ea;padding:14px;border:1px solid #40474d">'+notebookNote.replaceAll('<','&lt;')+'</textarea><p><button class="primary" onclick="notebookNote=document.getElementById(\'researchNote\').value;notify(\'Note saved for this session\')">Save note</button></p></div><div class="panel pad"><h2>Saved evidence</h2>'+notebookEvidence.map(id=>{let r=records.find(r=>r[0]===id);return '<div class="row"><div><strong>'+r[1]+'</strong><p>'+r[2]+' #'+id+' · 60042 / CDN</p></div><button onclick="detail(\''+id+'\')">Inspect ↗</button></div>'}).join('')+'</div></div>';case'Watchlists':return viewHeading('Keep your questions alive.','Track records, tables and patterns across future builds.','<button class="primary" onclick="createWatchlist()">+ New watchlist</button>')+'<div id="customWatches"></div><div class="grid"><div class="panel pad"><h2>Ember discoveries <span class="pill">18 NEW</span></h2><p>Mount additions, Emberflight changes and ember* assets.</p><div class="row"><code>table:Mount status:Added</code><button onclick="this.textContent=this.textContent===\'Pause\'?\'Resume\':\'Pause\'">Pause</button></div><div class="row"><code>name:ember*</code><button onclick="this.textContent=this.textContent===\'Pause\'?\'Resume\':\'Pause\'">Pause</button></div><button onclick="go(\'Build comparison\')">Review matches →</button></div><div class="panel pad"><h2>Crafting research</h2><p>Profession recipes and reagent changes. No new matches.</p><div class="notice">No matches in build 60042. This watchlist is up to date.</div><button onclick="notify(\'Watchlist JSON exported\');download(\'json\')">Export rules</button></div></div>';case'Build archive':return archiveScreen();case'Exports':return viewHeading('Make findings portable.','Export your evidence with build IDs, schema revisions and source metadata.')+'<div class="grid"><div class="panel pad"><h2>Prepare export</h2><label class="field">Scope<select id="exportScope"><option>Current build comparison</option><option>Selected database table</option><option>Watchlist matches</option><option>Asset metadata</option></select></label><label class="check"><input type="checkbox" checked> Include source and schema provenance</label><label class="check"><input type="checkbox" checked> Include field-level changes</label><label class="check"><input type="checkbox"> Include removed records only</label><div class="actions" style="margin-top:20px"><button class="primary" onclick="download(\'json\')">Download JSON</button><button onclick="download(\'csv\')">Download CSV</button></div></div><div class="panel pad"><h2>Export history</h2><div class="row"><div>comparison_60018_60042.json<p style="margin:5px 0">Today · 6 demo records · 2 KB</p></div><button onclick="download(\'json\')">↓</button></div><div class="notice">Exports contain fictional demo data and are safe to inspect. No real game assets are included.</div></div></div>';case'Background jobs':return viewHeading('Heavy work, in the background.','Manage downloads, decoding and indexing without blocking your investigation.')+'<div class="panel pad">'+jobs.map((j,i)=>'<div class="section"><div class="row"><div><h2 style="margin:0">'+j.name+'</h2><p>'+j.status+' · '+(j.status==='Failed'?'Encrypted archive has no available key':j.progress+'% · local demo task')+'</p></div><button onclick="jobs['+i+'].status=\''+(j.status==='Running'?'Cancelled':'Running')+'\';notify(\'Job '+(j.status==='Running'?'cancelled':'retried')+'\');render()">'+(j.status==='Running'?'Cancel':'Retry')+'</button></div><div class="bar"><i style="width:'+j.progress+'%;background:'+(j.status==='Failed'?'var(--red)':'var(--accent)')+'"></i></div></div>').join('')+'</div>';case'Settings':return viewHeading('A workspace on your terms.','Local configuration for your cross-platform desktop environment.')+'<div class="panel pad short" id="settingsForm"><h2>Sources & storage</h2><div class="notice">Shared store: 6.2 GB physical / 8.4 GB logical · 2.2 GB reused across builds · Derived indexes/previews keyed by content hash<br><label class="check"><input type="checkbox" checked> Pin active build 60042 during cleanup</label><button onclick="this.parentElement.innerHTML=\'Unreferenced derived objects cleared · Referenced shared data retained · Pinned build protected\'">Clean unreferenced objects</button></div><label class="field">Archive directory<input readonly value="VibeMiner app storage / archives" aria-label="App-owned archive location"></label><div class="grid"><label class="field">Default region<select><option>US</option><option>EU</option><option>KR</option><option>TW</option></select></label><label class="field">Locale<select><option>enUS</option><option>enGB</option><option>deDE</option><option>frFR</option></select></label></div><label class="field">Cache limit<select><option>50 GB</option><option>100 GB</option><option>Unlimited</option></select></label><h2 style="margin-top:28px">Research preferences</h2><label class="check"><input type="checkbox" checked> Hide story text until explicitly revealed</label><label class="check"><input type="checkbox" checked> Preserve archived CDN content and source metadata</label><label class="check"><input type="checkbox"> Check for new builds automatically</label><label class="check"><input type="checkbox" checked> Reduce motion</label><div class="actions" style="margin-top:22px"><button class="primary" onclick="saveSettings()">Save preferences</button><button onclick="onboard()">Open onboarding</button><button onclick="notify(\'Demo cache cleared; sample records retained\')">Clear cache</button></div></div>';}}
function onboard(){modal('Start a CDN investigation.','<p>VibeMiner downloads directly from the Warcraft CDN into its own archive. It does not read game installations or import game caches.</p><div class="notice">CDN-only source · App-owned archive · No game installation or Battle.net account required</div><label class="field">Workspace name<input value="Ember archive"></label><div class="grid"><label class="field">Product<select><option>World of Warcraft · PTR</option><option>World of Warcraft · Retail</option><option>World of Warcraft · Classic</option></select></label><label class="field">Region<select><option>US / enUS</option><option>EU / enGB</option></select></label></div><p>Retain downloaded old builds for comparisons and offline research. Remote availability varies; a manifest does not guarantee every old file is still available.</p><button class="primary" onclick="document.getElementById(\'modal\').close();go(\'Build archive\')">Choose builds to archive →</button>')}
let archiveBuilds=[{id:'12.0.0.60042',status:'Archived',size:'5.1 GB',unique:'2.9 GB',shared:'2.2 GB',pinned:true,progress:100},{id:'12.0.0.60018',status:'Archived',size:'3.3 GB',unique:'1.1 GB',shared:'2.2 GB',pinned:false,progress:100},{id:'11.2.7.59820',status:'Available on CDN',size:'4.2 GB',unique:'1.0 GB',shared:'3.2 GB',pinned:false,progress:0},{id:'11.2.5.59201',status:'Unavailable remotely',size:'Unknown',unique:'Unknown',shared:'Unknown',pinned:false,progress:0}];
function archiveScreen(){return viewHeading('Keep the builds that matter.','Download selected content from the CDN into the VibeMiner archive. Reopen retained snapshots offline.')+'<div class="notice">Shared object store · 6.2 GB physical / 8.4 GB logical · Build manifests reference content-addressed objects. Identical data is stored once per game, across downloads and caches. No game installations or external game caches are accessed. Old remote content can disappear; pin archived builds to retain them.</div><div class="panel pad">'+archiveBuilds.map((b,i)=>'<div class="section"><div class="row"><div><h2 style="margin:0">'+b.id+' '+(b.pinned?'<span class="pill">PINNED</span>':'')+'</h2><p>'+b.status+' · WoW PTR / US / enUS · '+b.size+' logical</p><small>'+b.unique+' '+(b.status==='Archived'?'unique / reclaimable':'additional download')+' · '+b.shared+' shared / reused</small></div><div class="actions"><button onclick="inspectBuild('+i+')">Inspect source</button>'+archiveActions(b,i)+'</div></div>'+(b.status==='Downloading'?'<div class="bar"><i style="width:'+b.progress+'%"></i></div><small>Verified download · '+b.progress+'% · original CDN content retained</small>':'')+'</div>').join('')+'</div>'}
function archiveActions(b,i){if(b.status==='Archived')return '<button onclick="openArchived('+i+')">Open offline</button><button onclick="archiveBuilds['+i+'].pinned=!archiveBuilds['+i+'].pinned;render()">'+(b.pinned?'Unpin':'Pin / retain')+'</button><button '+(b.pinned?'disabled title="Unpin before deleting"':'')+' onclick="deleteArchive('+i+')">Delete</button>';if(b.status==='Unavailable remotely')return '<button onclick="inspectBuild('+i+')">Why unavailable?</button>';if(b.status==='Downloading')return '<button onclick="completeArchive('+i+')">Finish demo download</button><button onclick="archiveBuilds['+i+'].status=\'Cancelled\';render()">Cancel</button>';return '<button class="primary" onclick="queueArchive('+i+')">'+(b.status==='Cancelled'?'Retry download':'Download old build')+'</button>'}
function queueArchive(i){archiveBuilds[i].status='Downloading';archiveBuilds[i].progress=43;render();notify('Missing unique objects queued; shared content will be reused')}
function completeArchive(i){archiveBuilds[i].status='Archived';archiveBuilds[i].progress=100;render();notify('Content verified; existing objects reused without duplication')}
function openArchived(i){selectedBuild=archiveBuilds[i].id;go('Overview');notify('Opened archived '+selectedBuild+' from VibeMiner storage')}
function inspectBuild(i){let b=archiveBuilds[i];modal('Build '+b.id,'<p>Source: Warcraft CDN · WoW PTR / US / enUS</p><p>Manifest: demo-'+b.id+' · State: '+b.status+'</p><p>Storage: VibeMiner content-addressed object store · Build manifest references shared content; identical data is never duplicated in cache or archive · Content verification: '+(b.status==='Archived'?'Verified demo content':'Pending / not retained')+'</p><div class="notice">'+(b.status==='Unavailable remotely'?'Manifest discovered, but required old content is unavailable on the CDN. This build cannot be reconstructed from this source. No game-install fallback is attempted.':'Retained content can be reopened without an internet connection. Unretained files require CDN availability.')+'</div>')}
function deleteArchive(i){modal('Delete archived build?','<p>Remove '+archiveBuilds[i].id+' from the app-owned archive? Reclaims only '+archiveBuilds[i].unique+' of unique unreferenced objects. '+archiveBuilds[i].shared+' of shared data remains for other retained builds. Future downloads depend on CDN availability.</p><button class="primary" onclick="confirmDeleteArchive('+i+')">Delete unpinned archive</button> <button onclick="document.getElementById(\'modal\').close()">Keep build</button>')}
function confirmDeleteArchive(i){if(!archiveBuilds[i].pinned){archiveBuilds[i].status='Available on CDN';archiveBuilds[i].progress=0}$('modal').close();render()}
let savedWatches=[],savedSettings=[],notebookEvidence=['901001'],notebookNote='Investigate Emberflight tuning and connected assets.\n\nDuration changed from 8s to 10s in fictional build 60042. Check related records before drawing a conclusion.';
function saveSettings(){savedSettings=Array.from(document.querySelectorAll('#settingsForm input,#settingsForm select')).map(e=>({value:e.value,checked:e.checked}));notify('Preferences saved for this session')}

function createWatchlist(){modal('Create watchlist','<label class="field">Watchlist name<input id="watchname" placeholder="New mounts"></label><label class="field">Match expression<input id="watchrule" placeholder="table:Mount status:Added"></label><button class="primary" onclick="saveWatch()">Create watchlist</button>')}
function saveWatch(){savedWatches.push({name:$('watchname').value||'Untitled watchlist',rule:$('watchrule').value||'table:Mount'});$('modal').close();render();paintWatches()}
function paintWatches(){if(page==='Watchlists'&&savedWatches.length)$('customWatches').innerHTML=savedWatches.map(w=>'<div class="panel pad section"><h2>'+w.name.replaceAll('<','&lt;')+'</h2><p>'+w.rule.replaceAll('<','&lt;')+'</p><button onclick="this.textContent=this.textContent===\'Pause\'?\'Resume\':\'Pause\'">Pause</button> <button onclick="go(\'Search\')">Review matches</button></div>').join('')}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();go('Search');document.querySelector('main input')?.focus()}});render();
