ields; table-specific decoding is represented by the selected demo record.</p>':''}ID <span class="pill">uint32 · primary key</span><br>Name_lang <span class="pill">localized string</span><br>${dbtable==='SpellEffect.db2'?'EffectBonusCoefficient':dbtable==='ItemSparse.db2'?'ItemLevel':'CreatureDisplayInfoID'} <span class="pill">${dbtable==='SpellEffect.db2'?'float32':'uint32'}</span><br>${dbtable==='SpellEffect.db2'?'SpellID':dbtable==='ItemSparse.db2'?'ItemAppearanceID':'SourceSpellID'} <span class="pill">foreign key</span><br>VerifiedBuild <span class="pill">int32</span><p>Demo definitions · revision a1d84 · enUS</p></div>`:`<div class="panel"><h2>${dbtable} · relationships</h2><p>Selected demo record: ${rows[chosen][1]}</p><h2>${dbtable==='SpellEffect.db2'?'SpellEffect → Spell → SpellName':dbtable==='ItemSparse.db2'?'ItemSparse → Item → ItemAppearance':'Mount → CreatureDisplayInfo → FileData'}</h2><p>Follow linked IDs to inspect related records.</p><div class="listitem">${dbtable==='SpellEffect.db2'?'SpellEffect 78425 → Spell 491207':dbtable==='ItemSparse.db2'?'ItemSparse 78422 → ItemAppearance 29812':'Mount 78421 → CreatureDisplayInfo 39012'}</div><br><button onclick="toast(\'Opened related Spell record 491207\')">Open linked record ↗</button><p style="margin-top:25px">Missing reference: CreatureDisplayInfo 39012<br>Referenced record is unavailable in this demo snapshot.</p></div>`}</div>${inspector()}</div>`;}else if(page==='Builds'){html=archiveScreen();}else if(page==='Investigations'){html=heading('Keep a thread worth following.','Saved evidence, notes and watchlists turn discoveries into investigations.',btn('New investigation',"modal('investigation')",true))+`<div class="list" style="margin-bottom:20px">${savedInvestigations.map(n=>'<div class="listitem"><div class="grow"><h2>'+escapeHtml(n.title)+'</h2><p>'+escapeHtml(n.notes)+'</p><p>Saved evidence: '+escapeHtml(n.evidence)+'</p></div></div>').join('')}${savedWatch.map(n=>'<div class="listitem"><h2>'+escapeHtml(n)+'</h2><span class="pill">7 demo matches</span><label style="margin:0"><input type="checkbox" checked style="width:auto;display:inline"> Enabled</label></div>').join('')}</div><div class="grid"><div class="panel"><div class="eyebrow">INVESTIGATION / 6 RECORDS</div><h2>The Frostwake trail</h2><p>A mount, a lantern, and a location. Connections to investigate before drawing conclusions.</p>${btn('Open evidence board',"modal('board')")}</div><div class="panel"><div class="eyebrow">WATCHLIST / 3 RULES</div><h2>Mounts & collectibles</h2><p>Mount.db2 additions · model paths containing “frost” · item appearance changes.</p>${btn('Edit watch rules',"modal('watch')")}</div><div class="panel"><div class="eyebrow">WATCHLIST / 7 MATCHES</div><h2>Class tuning</h2><p>Follow SpellEffect fields and save relevant differences with their source builds.</p>${btn('Review matches',"nav('Compare')")}</div></div><div class="panel" style="margin-top:22px"><h2>Recent evidence</h2>${table()}</div>`;}else if(page==='Exports'){html=heading('Evidence that travels.','Export structured records with build IDs, locale and source provenance.',btn('New export',"modal('export')",true))+`<div class="grid">${[['JSON bundle','Records, relationships and evidence metadata','json'],['CSV table','Readable flat records for spreadsheets','csv'],['Investigation package','Notes, selected records and source manifests','json']].map(r=>`<div class="panel"><h2>${r[0]}</h2><p>${r[1]}</p>${btn('Download demo '+r[2].toUpperCase(),"download('"+r[2]+"')")}</div>`).join('')}</div><div class="notice" style="margin-top:25px">Exports contain fictional demo records. Every file includes source identification; no game assets are downloaded.</div>`;}else if(page==='Jobs'){html=heading('The work behind the discoveries.','Downloads, indexing and exports run independently from your workspace.')+`${archiveJobScreen()}<div class="list" id="jobs">${[['Index DB2 records','62% · 18 of 29 tables','Running'],['Fetch model dependencies','Waiting for index','Queued'],['Export baseline records','Network interrupted · safe to retry','Failed']].map((r,i)=>`<div class="listitem"><div class="grow"><h3>${r[0]} <span class="pill">${r[2]}</span></h3><p>${r[1]}</p>${i===0?'<div class="progress"><i></i></div>':''}</div>${i===0?'<button onclick="this.textContent=this.textContent===\'Pause\'?\'Resume\':\'Pause\';this.closest(\'.listitem\').querySelector(\'.pill\').textContent=this.textContent===\'Resume\'?\'Paused\':\'Running\'">Pause</button>':''}<button onclick="this.closest('.listitem').querySelector('p').textContent='${i===2?'Retried · queued locally':'Cancelled by user'}';this.disabled=true">${i===2?'Retry':'Cancel'}</button></div>`).join('')}</div>`;}else if(page==='Search'){html=heading('Search the whole constellation','Find names, IDs, paths and text across archived builds.')+`<div class="toolbar"><input autofocus placeholder="Try frost, spell, 78421…" aria-label="Global search" oninput="filterCards(this.value)"><select aria-label="Search scope"><option>All archived builds</option><option>Selected archived build</option></select></div>${table()}<p class="small" style="margin-top:18px">6 demo results · encrypted contents and uncached files are not text-indexed.</p>`;}else if(page==='Settings'){html=heading('Make the observatory yours.','Local workspace preferences; changes apply only to this prototype.')+`${savedSettings?'<div class="notice">Saved this session: '+escapeHtml(savedSettings)+'</div>':''}<div class="grid"><div class="panel"><h2>Workspace</h2><label>Locale<select><option>enUS</option><option>enGB</option><option>deDE</option><option>frFR</option></select></label><label>Theme<select><option>Observatory midnight</option><option>Follow system</option></select></label><label>Source region<select><option>US</option><option>EU</option><option>KR</option></select></label></div><div class="panel"><h2>Owned archive & definitions</h2><p>2.9 GB unique objects · 4.5 GB logical builds · 1.6 GB shared · 20 GB limit</p><label>Cache limit (GB)<input type="number" value="20" min="1"></label>${btn('Review archive cleanup',"modal('cleanup')")}<p style="margin-top:20px">Definitions revision a1d84 · demo schema</p>${btn('Check definitions',"toast('Demo definitions are current')")}</div><div class="panel"><h2>Discovery controls</h2><label><input type="checkbox" checked style="width:auto;display:inline"> Blur narrative spoilers</label><label><input type="checkbox" checked style="width:auto;display:inline"> Hide encrypted assets by default</label><label><input type="checkbox" style="width:auto;display:inline"> Enable build watch notifications</label>${btn('Save preferences',"saveSettings()",true)}</div></div>`;}const state=$('#demo').value;if(state==='Loading')html=heading('Gathering the constellation…','Reading cached manifests and preparing previews.')+'<div class="panel"><div class="progress"><i></i></div><p style="margin-top:20px">Loading demo build · interface remains available</p></div>';if(state==='Empty')html='<div class="empty"><strong>Your observatory starts here.</strong><p>Choose an available Blizzard CDN build to download into your own archive.</p>'+btn('Set up a source',"modal('source')",true)+'</div>';if(state==='Error')html='<div class="empty"><strong>Manifest could not be read.</strong><p>Demo error: the selected manifest is incomplete. Existing cached data is safe.</p>'+btn('Retry',"$('#demo').value='Ready';render()",true)+' '+btn('View jobs',"$('#demo').value='Ready';nav('Jobs')")+'</div>';if(state==='Encrypted')html='<div class="empty"><strong>Contents are encrypted.</strong><p>Metadata is visible, but a decryption key is not available. Preview and decoded export are unavailable.</p><div class="pill purple">FileDataID 5812099 · source: CDN snapshot</div><p style="margin-top:20px">Keep this record in a watchlist to revisit its availability.</p>'+btn('Watch metadata',"modal('watch')")+'</div>';if(state==='Unknown schema')html='<div class="empty"><strong>This table needs a definition.</strong><p>FrostwakeActivity.db2 · unknown layout hash 0xA71C.<br>Raw metadata remains available. No decoded values are assumed.</p>'+btn('Check definitions',"toast('No matching definition available in demo')")+' '+btn('Export raw metadata',"download('json')")+'</div>';if(state==='Offline')html='<div class="notice">Offline · reopening your retained VibeMiner archive. New CDN downloads are paused. '+btn('Reconnect',"$('#demo').value='Ready';render()")+'</div>'+html;$('#main').innerHTML=html;if(page==='Settings'&&preferenceValues.length)document.querySelectorAll('#main input, #main select').forEach((e,i)=>{if(preferenceValues[i]){e.value=preferenceValues[i].value;e.checked=preferenceValues[i].checked}})}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function saveInvestigation(){savedInvestigations.push({title:$('#modal input').value,notes:$('#modal textarea').value,evidence:rows[chosen][1]});nav('Investigations')}function saveSettings(){preferenceValues=Array.from(document.querySelectorAll('#main input, #main select')).map(e=>({value:e.value,checked:e.checked}));savedSettings=Array.from(document.querySelectorAll('#main select')).map(e=>e.value).join(' · ');toast('Preferences saved for this session')}let toneContext,tone;function playTone(b){if(tone){tone.stop();tone=null;b.textContent='Play demo tone';return}toneContext=new(window.AudioContext||window.webkitAudioContext)();tone=toneContext.createOscillator();const gain=toneContext.createGain();tone.frequency.value=220;gain.gain.value=.035;tone.connect(gain);gain.connect(toneContext.destination);tone.start();b.textContent='Pause demo tone';setTimeout(()=>{if(tone){tone.stop();tone=null;b.textContent='Play demo tone'}},2500)}function nav(p){page=p;render();window.scrollTo(0,0)}function filterCards(q){document.querySelectorAll('.searchable').forEach(e=>e.style.display=e.dataset.name.includes(q.toLowerCase())?'':'none')}function inspect(i){chosen=i;modal('asset')}function toast(s){let e=document.createElement('div');e.className='notice';e.style='position:fixed;bottom:40px;right:25px;z-index:99;max-width:450px';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3500)}function download(type){const data={demo:true,scope:exportScope,investigations:exportScope==='Selected investigation'?savedInvestigations:undefined,build:'12.0.0.64018',locale:'enUS',source:'CDN snapshot (fictional)',records:rows.map(r=>({id:r[0],name:r[1],type:r[2],status:r[3]}))};let text=type==='csv'?'Demo,Build,Source,ID,Name,Type,Status,Scope\n'+rows.map(r=>'true,12.0.0.64018,Fictional CDN snapshot,'+r.slice(0,4).join(',')+','+exportScope).join('\n'):JSON.stringify(data,null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type==='csv'?'text/csv':'application/json'}));a.download='vibeminer-demo.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Demo '+type.toUpperCase()+' downloaded')}

function archiveScreen(){return heading('Your build constellation','Download available CDN builds into an independent, verified VibeMiner archive. Retain old builds for later research.',btn('Browse CDN builds',"modal('source')",true))+`<div class="notice">Standalone research archive · Blizzard CDN → shared content-addressed store. Build manifests reference verified objects; identical bytes are stored once across all versions.</div><div class="list">${archives.map((a,i)=>`<div class="listitem"><div style="font-size:30px;color:var(--purple)">◈</div><div class="grow"><h2>${a.product} <span class="small">${a.id}</span></h2><p>${a.state} · ${a.size} · US · enUS ${a.pinned?'· PINNED':''}</p><p>${a.state==='Archived'?'Manifest verified · logical '+a.size+' · 1.6 GB shared objects · '+(i===0?'0.8':'0.5')+' GB exclusive / reclaimable':a.state==='Unavailable remotely'?'Not retained; older builds cannot be fetched if CDN content is gone':'Logical 2.0 GB · 1.6 GB already shared · 0.4 GB unique additional download'}</p></div>${btn('Details',`selectedArchive=${i};modal('archiveDetail')`)}${a.state==='Archived'?btn('Open archive',`openArchive(${i})`)+btn(a.pinned?'Unpin':'Pin / retain',`archives[${i}].pinned=!archives[${i}].pinned;render()`):a.state==='Available on CDN'?btn('Download',`queueArchive(${i})`,true):a.state==='Queued'||a.state==='Downloading'?btn('View progress',"nav('Jobs')"):a.state==='Cancelled'?btn('Retry',`queueArchive(${i})`):'<span class="pill red">Unavailable</span>'}</div>`).join('')}</div><div class="grid" style="margin-top:22px"><div class="panel"><h2>Selective downloads</h2><p>Keep metadata and selected research assets, or retain a complete available build. Old content must still be available on the CDN.</p>${btn('Plan a download',"modal('source')")}</div><div class="panel"><h2>Offline research</h2><p>Archived content opens without a network connection. Unretained assets remain unavailable offline.</p>${btn('Reopen archived baseline offline',"$('#demo').value='Offline';openArchive(1)")}</div><div class="panel"><h2>Retention & cleanup</h2><p>Pinned manifests protect their referenced objects. Cleanup reclaims only objects with no remaining build reference; shared bytes stay retained.</p>${btn('Review cleanup',"modal('cleanup')")}</div></div>`}
function openArchive(i){selectedArchive=i;if(archives[i].state!=='Archived'){toast('Download this build before reopening it');return}$('#build').innerHTML=`<option>${archives[i].product} · ${archives[i].id} · owned archive</option>`;nav('Database')}
function queueArchive(i){if($('#demo').value==='Offline'){toast('Reconnect to download from CDN');return}archives[i].state='Queued';archiveJobs.push({i,state:'Queued',percent:0});nav('Jobs')}
function archiveJobScreen(){return `<div class="list" style="margin-bottom:20px">${archiveJobs.map((j,n)=>`<div class="listitem"><div class="grow"><h3>Archive ${archives[j.i].id} <span class="pill">${j.state}</span></h3><p>Blizzard CDN → shared object store · ${j.percent}% · only 0.4 GB new objects · existing 1.6 GB reused</p><div class="progress"><i style="width:${j.percent}%"></i></div></div>${j.state==='Complete'?'<span class="pill">Verified / retained</span>':j.state==='Cancelled'?btn('Retry',`archiveJobs[${n}].state='Queued';archiveJobs[${n}].percent=0;archives[${j.i}].state='Queued';render()`):btn(j.percent===0?'Start download':'Advance demo progress',`advanceArchive(${n})`)+btn('Cancel',`archiveJobs[${n}].state='Cancelled';archives[${j.i}].state='Cancelled';render()`)}</div>`).join('')}</div>`}
function advanceArchive(n){let j=archiveJobs[n];j.percent=Math.min(100,j.percent+50);j.state=j.percent===100?'Complete':'Downloading';archives[j.i].state=j.percent===100?'Archived':'Downloading';render()}
function archiveModal(type){let title='',body='',action='Done',run="$('#modal').close()";if(type==='cleanup'){title='Review archive cleanup';body='<p>Confirm manifest removal. Only unreferenced content objects are reclaimed. Shared objects referenced by another build remain stored once. Evidence references remain; deleted unique objects require an available CDN to restore.</p>'+archives.map((a,i)=>a.state==='Archived'?`<label><input type="checkbox" name="cleanup" value="${i}" ${a.pinned?'disabled':''}> ${a.id} · logical ${a.size} · shared 1.6 GB retained · reclaimable ${i===0?'0.8':'0.5'} GB · ${a.pinned?'Pinned — protected':'Remove manifest + unreferenced objects'}</label>`:'').join('');action='Confirm removal';run="document.querySelectorAll('#modal input:checked').forEach(e=>{archives[Number(e.value)].state='Available on CDN'});nav('Builds');$('#modal').close()"}else if(type==='archiveDetail'){const a=archives[selectedArchive];title='Exact snapshot · '+a.id;body=`<dl><dt>Product / region / locale</dt><dd>${a.product} / US / enUS</dd><dt>Acquisition source</dt><dd>Blizzard CDN · fictional manifest demo-${a.id}</dd><dt>VibeMiner archive</dt><dd>${a.state} · ${a.size} · ${a.pinned?'Pinned':'Unpinned'}</dd><dt>Content identity</dt><dd>CKey demo-a73f…41c8 · EKey demo-98be…6d12</dd><dt>Verification</dt><dd>${a.state==='Archived'?'Retained content hashes verified · captured October 17, 2026':'Content not retained · download required'}</dd></dl><p>Logical size differs from physical storage. This manifest references shared objects in one content-addressed store; duplicate bytes are never stored again. Metadata-only entries do not promise older content remains downloadable.</p>`}else{title='Download from Blizzard CDN';body='<p>VibeMiner maintains its own independent archive. Pick an available snapshot and download scope.</p><label>Product<select><option>Retail / US / enUS</option></select></label><label>Available older build<select id="archive-choice">'+archives.map((a,i)=>`<option value="${i}" ${a.state!=='Available on CDN'?'disabled':''} ${i===2?'selected':''}>${a.id} · ${a.state}</option>`).join('')+'</select></label><label>Retention scope<select><option>Metadata + selected research content</option><option>Complete available build</option></select></label><p>Estimated logical size: 2.0 GB · shared/reused: 1.6 GB · unique additional download: 0.4 GB. Existing verified objects are referenced directly, never copied into a second cache. Historical metadata alone cannot restore removed CDN content.</p>';action='Queue download';run="queueArchive(Number($('#archive-choice').value));$('#modal').close()"}$('#modal').innerHTML='<h2>'+title+'</h2>'+body+'<div class="row" style="justify-content:flex-end">'+btn('Cancel',"$('#modal').close()")+btn(action,run,true)+'</div>';$('#modal').showModal()}

function modal(type){let body='',title='',action='Save',run="saveInvestigation()";if(['source','archive','cleanup','archiveDetail'].includes(type)){archiveModal(type);return}else if(type==='asset'){const r=rows[chosen];title=r[1];body='<div class="art" style="height:270px">'+art(r[2])+'</div><p style="margin-top:16px">'+r[2]+' · '+r[0]+' · '+r[3]+'<br>Source: fictional CDN snapshot · build 64018</p><div class="toolbar">'+(['Mount','Model','Texture'].includes(r[2])?btn('Rotate ↻',"this.closest('dialog').querySelector('svg')?.setAttribute('style','transform:scaleX(-1)')"):'')+(r[2]==='Sound'?btn('Play demo tone',"playTone(this)"):'')+'</div><p class="small">Original illustrative preview. This is not a Blizzard game asset.</p>';action='Save evidence';run="savedInvestigations.push({title:'Evidence: '+rows[chosen][1],notes:'Source: fictional CDN snapshot · build 64018',evidence:rows[chosen][0]});nav('Investigations')"}else if(type==='watch'){title='Watch for a signal';run="savedWatch.push(Array.from(document.querySelectorAll('#modal input')).slice(0,2).map(e=>e.value).join(' · '));nav('Investigations')";body='<label>Watchlist name<input value="Mounts & collectibles"></label><label>Table or path rule<input value="Mount.db2 OR path contains frost"></label><label>Change types<select><option>Added + changed + removed</option><option>Added only</option></select></label><label><input type="checkbox" checked> Notify when a cached build matches</label>'}else if(type==='export'){title='Export selected evidence';body='<label>Format<select id="format"><option value="json">JSON with provenance</option><option value="csv">CSV table</option></select></label><label>Scope<select id="scope"><option>Current demo records</option><option>Selected investigation</option></select></label><p>Build, locale, source and fictional-data labels are included.</p>';action='Download';run="exportScope=$('#scope').value;download($('#format').value)"}else if(type==='board'){title='The Frostwake trail';body='<div class="listitem">◈ Frostwake Courser → CreatureDisplayInfo 39012</div><br><div class="listitem">◇ Frostwake overlook → Map 2841</div><label style="margin-top:20px">Investigation notes<textarea rows="4">Possible visual connection; no release claim. Check related quest and mount records in next build.</textarea></label>';action='Save notes';run="savedNotes=$('#modal textarea').value;savedInvestigations.push({title:'The Frostwake trail · notes',notes:savedNotes,evidence:'6 linked records'});nav('Investigations')"}else{title=type==='save'?'Save evidence':'New investigation';body='<label>Title<input value="The Frostwake trail"></label><label>Notes<textarea rows="4" placeholder="What did you find? What remains uncertain?"></textarea></label><p>Selected evidence includes its build, locale and source.</p>'}$('#modal').innerHTML='<div class="row"><h2 class="grow">'+title+'</h2><button onclick="$(\'#modal\').close()" aria-label="Close dialog">×</button></div>'+body+'<div class="row" style="justify-content:flex-end;margin-top:25px">'+btn('Cancel',"$('#modal').close()")+btn(action,run+";$('#modal').close()",true)+'</div>';$('#modal').showModal()}
$('#demo').onchange=render;$('#build').onchange=()=>{toast('Selected '+$('#build').value);render()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();nav('Search')}});render();
</script><script src="../research.js" data-concept="observatory"></script></body></html>
